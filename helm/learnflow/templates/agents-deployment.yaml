apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.agents.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.agents.name }}
spec:
  replicas: {{ .Values.agents.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.agents.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.agents.name }}
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "learnflow-agents"
        dapr.io/app-port: "{{ .Values.agents.port }}"
        dapr.io/http-port: "{{ .Values.dapr.sidecar.httpPort }}"
        dapr.io/grpc-port: "{{ .Values.dapr.sidecar.grpcPort }}"
    spec:
      containers:
      - name: agents
        image: {{ .Values.agents.image }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.agents.port }}
        env:
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: anthropic-api-key
              key: api-key
        - name: DAPR_HTTP_PORT
          value: "{{ .Values.dapr.sidecar.httpPort }}"
        resources:
          {{- toYaml .Values.agents.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.agents.port }}
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.agents.port }}
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.agents.name }}
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: {{ .Values.agents.name }}
  ports:
  - port: {{ .Values.agents.port }}
    targetPort: {{ .Values.agents.port }}
    name: http
  type: ClusterIP
